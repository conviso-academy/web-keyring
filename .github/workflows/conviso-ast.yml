name: Conviso AST & Security Gate

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  conviso-security:
    name: Conviso AST & Security Gate
    runs-on: ubuntu-latest

    container:
      image: convisoappsec/convisoast:latest

    env:
      CONVISO_API_KEY: ${{ secrets.CONVISO_API_KEY }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Criar regras do Security Gate
        run: |
          cat <<'EOF' > security-gate.yml
          rules:
            - from: any
              severity:
                critical:
                  maximum: 0
                high:
                  maximum: 0
          EOF

      - name: Executar Conviso AST
        run: |
          conviso ast run --vulnerability-auto-close

      - name: Executar Security Gate
        run: |
          conviso vulnerability assert-security-rules \
            --rules-file security-gate.yml

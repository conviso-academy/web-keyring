services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["./entrypoint.sh"]
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - frontend_net

volumes:
  pgdata:

networks:
  backend_net:
    internal: true
  frontend_net:
